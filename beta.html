<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reelbox">
<meta name="theme-color" content="#14171C">
<title>Reelbox</title>
<style>
  :root { --bg:#14171C; --surface:#1C2129; --border:#2A2F38; --text:#E9E6DE; --muted:#8A9099; --accent:#E8A33D; --danger:#E2685C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,'Segoe UI',sans-serif; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
  .brand { font-weight:700; font-size:19px; } .brand span { color:var(--accent); }
  .who { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  button { font-family:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 14px; font-size:14px; }
  button.primary { background:var(--accent); color:#17130A; border-color:var(--accent); font-weight:600; }
  button.text { background:none; border:none; color:var(--muted); }
  button:disabled { opacity:.5; }
  main { max-width:780px; margin:0 auto; padding:28px 20px 80px; }
  .auth { max-width:360px; margin:6vh auto 0; }
  .auth h1 { font-size:26px; margin:0 0 20px; }
  input[type=email], input[type=password] { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:8px; font-size:16px; margin-bottom:12px; }
  .msg { font-size:13px; color:var(--danger); min-height:18px; margin-top:10px; line-height:1.5; }
  .msg.ok { color:var(--accent); }
  .switch { margin-top:16px; font-size:13px; color:var(--muted); } .switch a { color:var(--accent); cursor:pointer; }
  .upload { border:1px dashed var(--border); border-radius:12px; padding:22px; text-align:center; margin-bottom:28px; }
  .upload p { margin:0 0 12px; color:var(--muted); font-size:14px; }
  input[type=file] { display:none; }
  .grid { display:grid; grid-template-columns:1fr; gap:20px; }
  @media (min-width:640px) { .grid { grid-template-columns:1fr 1fr; } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .card video { width:100%; display:block; background:#000; max-height:260px; }
  .meta { padding:12px 14px; display:flex; gap:8px; align-items:center; }
  .meta .title { flex:1; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta button { padding:5px 9px; font-size:12px; }
  .arow { padding:0 14px 14px; } .arow button { width:100%; }
  .report { border-top:1px solid var(--border); padding:12px 14px 14px; font-size:13px; line-height:1.5; }
  .report .err { color:var(--danger); } .report .dim { color:var(--muted); }
  .rows { max-height:150px; overflow-y:auto; margin-top:8px; color:var(--muted); font-size:12px; }
  .rows b { color:var(--accent); font-weight:500; display:inline-block; width:42px; }
  .empty { color:var(--muted); text-align:center; padding:30px 0; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span>&#9635;</span> Reelbox</div>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== PASTE YOUR TWO SUPABASE VALUES HERE ======
const SUPABASE_URL = 'PASTE_PROJECT_URL_HERE';
const SUPABASE_KEY = 'PASTE_ANON_KEY_HERE';
// The only account allowed to refresh the reference table from the app. Everyone can still VIEW it.
const OWNER_EMAIL = 'sharonlixr@gmail.com';
// =================================================

const app = document.getElementById('app');
const who = document.getElementById('who');
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

if (SUPABASE_URL.startsWith('PASTE') || SUPABASE_KEY.startsWith('PASTE')) {
  app.innerHTML = '<div class="empty">Setup needed: open this file and paste your Supabase Project URL and anon key at the top of the script.</div>';
} else {
  start();
}

function start() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let mode = 'login';
  let user = null;

  sb.auth.getSession().then(({ data }) => { user = data.session ? data.session.user : null; render(); });
  sb.auth.onAuthStateChange((_e, session) => { user = session ? session.user : null; render(); });

  function render() {
    who.innerHTML = '';
    if (!user) return renderAuth();
    who.innerHTML = '<span>' + esc(user.email) + '</span>';
    const s = document.createElement('button'); s.className = 'text'; s.textContent = '⚙ Settings';
    s.onclick = () => {
      const panel = document.getElementById('settingsPanel');
      if (!panel) return;
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      if (panel.style.display === 'block') renderSettingsPanel(panel);
    };
    who.appendChild(s);
    const b = document.createElement('button'); b.className = 'text'; b.textContent = 'Log out';
    b.onclick = () => sb.auth.signOut();
    who.appendChild(b);
    renderDash();
  }

  function renderAuth() {
    const login = mode === 'login';
    app.innerHTML = `<div class="auth"><h1>${login ? 'Log in' : 'Create account'}</h1>
      <input id="em" type="email" placeholder="Email" autocomplete="email">
      <input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="${login ? 'current-password' : 'new-password'}">
      <button class="primary" id="go">${login ? 'Log in' : 'Sign up'}</button>
      <div class="msg" id="msg"></div>
      <div class="switch">${login ? "New here? <a id='sw'>Create an account</a>" : "Have an account? <a id='sw'>Log in</a>"}</div></div>`;
    document.getElementById('sw').onclick = () => { mode = login ? 'signup' : 'login'; renderAuth(); };
    const go = async () => {
      const email = document.getElementById('em').value.trim();
      const password = document.getElementById('pw').value;
      const msg = document.getElementById('msg');
      msg.className = 'msg'; msg.textContent = '';
      if (!email || !password) { msg.textContent = 'Enter email and password.'; return; }
      const res = login ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
      if (res.error) { msg.textContent = res.error.message; return; }
      if (!login && !res.data.session) { msg.className = 'msg ok'; msg.textContent = 'Check your email to confirm, then log in.'; }
    };
    document.getElementById('go').onclick = go;
    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  function renderDash() {
    app.innerHTML = `<div id="settingsPanel" style="display:none;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);font-size:12px"></div>
      <div class="upload"><p>Upload a video. It is saved to your account and available on any device.</p>
      <button class="primary" id="pick">Choose video</button><input type="file" id="file" accept="video/*">
      <div style="margin-top:14px;text-align:left;font-size:12px;color:var(--muted)">Optional — helps the AI assessment be more accurate:
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <input id="subAge" type="number" placeholder="Age" style="width:80px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:8px;font-size:14px">
          <input id="subHeight" type="number" placeholder="Height (cm)" style="width:120px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:8px;font-size:14px">
          <select id="subView" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:8px;font-size:14px">
            <option value="">Camera view (auto-detected if left blank)</option>
            <option value="front">Front</option>
            <option value="side">Side</option>
            <option value="rear">Rear</option>
          </select>
        </div>
      </div>
      <div class="msg" id="upmsg"></div></div>
      <div class="grid" id="grid"></div>
      <div style="margin-top:28px"><b>Gait age history</b>
        <div class="dim" style="font-size:12px;margin:4px 0 10px">Every time you run Analyze pose on a walking clip, the parameters and estimate are saved here so you can compare over time.</div>
        <div id="history"></div>
      </div>`;
    const file = document.getElementById('file');
    document.getElementById('pick').onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files[0]; if (!f) return;
      const m = document.getElementById('upmsg');
      m.className = 'msg ok'; m.textContent = 'Uploading ' + f.name + ' ...';
      const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = user.id + '/' + Date.now() + '_' + safe;
      const up = await sb.storage.from('videos').upload(path, f, { contentType: f.type || 'video/mp4' });
      if (up.error) { m.className = 'msg'; m.textContent = 'Upload failed: ' + up.error.message; return; }
      const ageV = document.getElementById('subAge').value, hV = document.getElementById('subHeight').value, vV = document.getElementById('subView').value;
      const ins = await sb.from('videos').insert({
        title: f.name, path,
        subject_age: ageV ? +ageV : null,
        subject_height_cm: hV ? +hV : null,
        camera_view: vV || null
      });
      if (ins.error) { m.className = 'msg'; m.textContent = 'Saved file but not record: ' + ins.error.message; return; }
      m.textContent = ''; file.value = '';
      loadGrid();
    };
    loadGrid();
    loadHistory();
    loadReferenceData();
    loadWeights();
  }

  let versionsCache = [];

  async function loadVersions() {
    const { data, error } = await sb.from('gait_reference_versions').select('*').order('created_at', { ascending: false });
    versionsCache = (!error && data) ? data : [];
    return versionsCache;
  }

  async function renderSettingsPanel(panel) {
    const isOwner = user && user.email === OWNER_EMAIL;
    panel.innerHTML = `<div class="dim" style="font-size:11px;margin-bottom:10px">${isOwner ? 'You are the app owner — you can refresh and switch the active reference dataset.' : 'Only the app owner can refresh or switch the reference dataset. You can view its source below.'}</div>
      <div style="margin-bottom:10px">
        <label class="dim" style="display:block;font-size:11px;margin-bottom:4px">Source of reference</label>
        <select id="sourceSelect" ${isOwner ? '' : 'disabled'} style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:12px"></select>
        <div id="sourceDetail" class="dim" style="font-size:11px;margin-top:6px;line-height:1.5"></div>
      </div>
      <div style="margin-bottom:10px">
        <label class="dim" style="display:block;font-size:11px;margin-bottom:4px">Refresh source</label>
        <select id="refreshSelect" disabled style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:12px"></select>
        ${isOwner ? '<button class="text" id="refreshBtn" style="border:1px solid var(--border);border-radius:8px;margin-top:8px;width:100%">Check for updated research data</button>' : ''}
        <div id="refreshStatus" class="dim" style="font-size:11px;margin-top:6px"></div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <label class="dim" style="display:block;font-size:11px;margin-bottom:4px">Calculation weight (owner only)</label>
        <div class="dim" style="font-size:11px;margin-bottom:6px">How much each measurement counts toward the total gait age score. Equal (1 each) reproduces a plain average.</div>
        <div id="weightRows"></div>
        ${isOwner ? '<button class="primary" id="saveWeights" style="margin-top:8px;width:100%">Save weights</button><div id="weightStatus" class="dim" style="font-size:11px;margin-top:6px"></div>' : ''}
      </div>`;

    await loadVersions();
    if (!versionsCache.length) await ensureDefaultVersion();
    populateVersionDropdowns();

    const sourceSelect = document.getElementById('sourceSelect');
    sourceSelect.onchange = async () => {
      if (!isOwner) return;
      const id = sourceSelect.value;
      await sb.from('gait_reference_versions').update({ is_active: false }).neq('id', id);
      await sb.from('gait_reference_versions').update({ is_active: true }).eq('id', id);
      await loadVersions();
      populateVersionDropdowns();
      await loadReferenceData();
    };

    const refreshSelect = document.getElementById('refreshSelect');
    refreshSelect.onchange = () => showSourceDetail(refreshSelect.value);

    if (isOwner) document.getElementById('refreshBtn').onclick = async (e) => {
      const status = document.getElementById('refreshStatus');
      e.target.disabled = true; e.target.textContent = 'Searching…';
      status.textContent = 'Asking the research-check service for an updated dataset — this can take 10-20 seconds.';
      try {
        const { data, error } = await sb.functions.invoke('refresh-gait-reference', { body: {} });
        if (error) throw error;
        if (!data || !data.found) {
          status.textContent = 'No newer credible dataset was found. Current data unchanged.';
        } else {
          const { data: vRow, error: vErr } = await sb.from('gait_reference_versions').insert({
            label: data.sourceLabel || ('Found ' + new Date().toLocaleDateString()),
            source_note: data.sourceNote || data.sourceUrl || null,
            status: 'pending_review', is_active: false
          }).select().single();
          if (vErr) throw vErr;
          const rows = (data.bands || []).map(b => ({ version_id: vRow.id, band: b.band, mid: b.mid, cadence: b.cadence, stride_length: b.strideLength, knee_rom: b.kneeROM, knee_height_var: b.kneeHeightVar }));
          if (rows.length) await sb.from('gait_reference').insert(rows);
          await loadVersions();
          populateVersionDropdowns();
          status.textContent = 'Found "' + (data.sourceLabel || 'a new dataset') + '" — added to the lists below as pending review. Select it from "Source of reference" to make it active.';
        }
      } catch (err) {
        status.textContent = 'Could not check for updates: ' + esc(String((err && err.message) || err));
      }
      e.target.disabled = false; e.target.textContent = 'Check for updated research data';
    };

    await loadWeights();
    const weightRows = document.getElementById('weightRows');
    weightRows.innerHTML = Object.keys(WEIGHT_LABELS).map(k => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0">
        <span style="font-size:12px">${esc(WEIGHT_LABELS[k])}</span>
        <input class="weightInput" data-key="${k}" type="number" min="0" step="0.1" value="${gaitWeights[k]}" ${isOwner ? '' : 'disabled'} style="width:70px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:8px;font-size:12px;text-align:right">
      </div>`).join('');
    if (isOwner) document.getElementById('saveWeights').onclick = async (e) => {
      const status = document.getElementById('weightStatus');
      e.target.disabled = true; e.target.textContent = 'Saving…';
      try {
        const rows = Array.from(panel.querySelectorAll('.weightInput')).map(inp => ({
          metric_key: inp.dataset.key, label: WEIGHT_LABELS[inp.dataset.key],
          weight: inp.value === '' ? 1 : +inp.value, updated_at: new Date().toISOString()
        }));
        for (const r of rows) {
          const { error } = await sb.from('gait_weights').upsert(r, { onConflict: 'metric_key' });
          if (error) throw error;
        }
        await loadWeights();
        status.textContent = 'Saved. New weights apply the next time a video is analyzed or its report is reopened.';
      } catch (err) {
        status.textContent = 'Could not save weights: ' + esc(String((err && err.message) || err));
      }
      e.target.disabled = false; e.target.textContent = 'Save weights';
    };
  }

  async function ensureDefaultVersion() {
    // First run: no versions table rows yet. Create one "default" version and attach
    // any existing unversioned gait_reference rows to it, so the dropdowns aren't empty.
    // Deliberately does NOT chain .select().single() after insert -- that chain can fail
    // on some RLS/grant setups even when the insert itself succeeds, which previously
    // caused this whole function to bail out silently and leave the dropdown empty.
    const { error: insErr } = await sb.from('gait_reference_versions').insert({
      label: 'PMC6660692 (default)',
      source_note: 'PubMed Central — published motion-capture study of healthy adults, mean gait measurements by age decade.',
      status: 'verified', is_active: true
    });
    if (insErr) {
      console.error('ensureDefaultVersion insert failed:', insErr.message);
      const detail = document.getElementById('sourceDetail');
      if (detail) detail.textContent = 'Could not create a default reference version: ' + insErr.message;
      return;
    }
    await loadVersions();
    const v = versionsCache.find(x => x.is_active);
    if (v) await sb.from('gait_reference').update({ version_id: v.id }).is('version_id', null);
  }

  function populateVersionDropdowns() {
    const sourceSelect = document.getElementById('sourceSelect'), refreshSelect = document.getElementById('refreshSelect');
    if (!sourceSelect) return;
    if (!versionsCache.length) {
      sourceSelect.innerHTML = '<option value="">No reference versions found</option>';
      refreshSelect.innerHTML = '<option value="">— history of checks / candidates —</option>';
      const detail = document.getElementById('sourceDetail');
      if (detail && !detail.textContent) detail.textContent = 'No reference dataset is set up yet. Reopen Settings, or ask the owner to check Supabase.';
      return;
    }
    sourceSelect.innerHTML = versionsCache.map(v => `<option value="${v.id}" ${v.is_active ? 'selected' : ''}>${esc(v.label)}${v.is_active ? ' (active)' : ''}</option>`).join('');
    refreshSelect.innerHTML = '<option value="">— history of checks / candidates —</option>' + versionsCache.map(v => `<option value="${v.id}">${esc(v.label)} (${new Date(v.created_at).toLocaleDateString()}, ${v.status})</option>`).join('');
    const active = versionsCache.find(v => v.is_active);
    if (active) showSourceDetail(active.id);
  }

  async function showSourceDetail(versionId) {
    const el = document.getElementById('sourceDetail');
    if (!el || !versionId) return;
    const v = versionsCache.find(x => x.id === versionId);
    if (!v) return;
    const { data: rows } = await sb.from('gait_reference').select('*').eq('version_id', versionId).order('mid');
    el.innerHTML = `<b>${esc(v.label)}</b> &middot; status: ${v.status}${v.source_note ? '<br>' + esc(v.source_note) : ''}
      <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:11px">
        <tr><th style="text-align:left;padding:3px 6px 3px 0">Band</th><th style="text-align:left;padding:3px 6px 3px 0">Cadence</th><th style="text-align:left;padding:3px 6px 3px 0">Stride (m)</th><th style="text-align:left;padding:3px 6px 3px 0">Knee ROM</th><th style="text-align:left;padding:3px 6px 3px 0">Knee ht. var.</th></tr>
        ${(rows || []).map(b => `<tr><td style="padding:3px 6px 3px 0">${b.band}</td><td style="padding:3px 6px 3px 0">${b.cadence ?? '—'}</td><td style="padding:3px 6px 3px 0">${b.stride_length ?? '—'}</td><td style="padding:3px 6px 3px 0">${b.knee_rom ?? '—'}</td><td style="padding:3px 6px 3px 0">${b.knee_height_var ?? '—'}</td></tr>`).join('')}
      </table>`;
  }

  async function loadHistory() {
    const box = document.getElementById('history');
    if (!box) return;
    const { data: rows, error } = await sb.from('gait_history').select('*').order('created_at', { ascending: false }).limit(50);
    if (error) { box.innerHTML = '<div class="dim" style="font-size:12px">' + esc(error.message) + '</div>'; return; }
    if (!rows.length) { box.innerHTML = '<div class="dim" style="font-size:12px">No gait estimates saved yet.</div>'; return; }
    box.innerHTML = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px;color:var(--muted);white-space:nowrap">
      <tr><th style="text-align:left;padding:4px 8px 4px 0">Date</th><th style="text-align:left;padding:4px 8px 4px 0">Cadence</th><th style="text-align:left;padding:4px 8px 4px 0">Variability</th><th style="text-align:left;padding:4px 8px 4px 0">Stride</th><th style="text-align:left;padding:4px 8px 4px 0">Knee ROM</th><th style="text-align:left;padding:4px 8px 4px 0">Hip ROM</th><th style="text-align:left;padding:4px 8px 4px 0">Clearance</th></tr>
      ${rows.map(r => `<tr>
        <td style="padding:4px 8px 4px 0">${new Date(r.created_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'})}</td>
        <td style="padding:4px 8px 4px 0">${r.cadence ?? '—'}</td>
        <td style="padding:4px 8px 4px 0">${r.step_cv ?? '—'}%</td>
        <td style="padding:4px 8px 4px 0">${r.stride_length_m != null ? r.stride_length_m + 'm' + (r.stride_reliable ? '' : '*') : '—'}</td>
        <td style="padding:4px 8px 4px 0">${r.knee_rom ?? '—'}&deg;</td>
        <td style="padding:4px 8px 4px 0">${r.hip_rom ?? '—'}&deg;</td>
        <td style="padding:4px 8px 4px 0">${r.foot_clearance_cm ?? '—'}</td>
      </tr>`).join('')}
    </table></div>
    <div class="dim" style="font-size:11px;margin-top:4px">* stride length not reliable for this entry (needs height + side-on camera view)</div>`;
  }

  async function loadGrid() {
    const grid = document.getElementById('grid');
    const { data: rows, error } = await sb.from('videos').select('*').order('created_at', { ascending: false });
    if (error) { grid.innerHTML = '<div class="empty">' + esc(error.message) + '</div>'; return; }
    if (!rows.length) { grid.innerHTML = '<div class="empty">No videos yet. Upload your first one above.</div>'; return; }
    const { data: signed } = await sb.storage.from('videos').createSignedUrls(rows.map(r => r.path), 3600);
    const urlFor = {}; (signed || []).forEach(s => { urlFor[s.path] = s.signedUrl; });
    grid.innerHTML = '';
    rows.forEach(item => {
      const url = urlFor[item.path] || '';
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<video src="${url}" controls playsinline crossorigin="anonymous" preload="metadata"></video>
        <div class="meta"><span class="title">${esc(item.title || 'video')}</span>
        <button class="dl">Download</button><button class="editInfo">Edit info</button><button class="del">Delete</button></div>
        <div class="infoBox" style="display:none;padding:0 14px 14px;font-size:12px">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
            <input class="fAge" type="number" placeholder="Age" value="${item.subject_age ?? ''}" style="width:70px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:13px">
            <input class="fHeight" type="number" placeholder="Height (cm)" value="${item.subject_height_cm ?? ''}" style="width:110px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:13px">
            <select class="fView" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:13px">
              <option value="" ${!item.camera_view ? 'selected' : ''}>Camera view (auto-detect)</option>
              <option value="front" ${item.camera_view === 'front' ? 'selected' : ''}>Front</option>

  // ---------- MediaPipe Pose Landmarker ----------
  let landmarkerP = null;

      posture: {

        headOffset: +((nose.x - (lSh.x + rSh.x) / 2) * 100).toFixed(1),      // % of frame width, + = head right of shoulder center
        spineLean: +(((lSh.x + rSh.x) / 2 - (lHip.x + rHip.x) / 2) * 100).toFixed(1) // + = shoulders right of hips

      symmetry: {

        hipHeightDiff: +(Math.abs(lHip.y - rHip.y) * 100).toFixed(1),

  function avgOf(rows, cat, key) {
    const vals = rows.filter(r => r.m).map(r => r.m[cat][key]).filter(v => v !== null && v !== undefined);

  function table(rows, cat, cols) {
    return `<table style="width:100%;border-collapse:collapse;font-size:12px;color:var(--muted);margin-top:6px">
      <tr><th style="text-align:left;font-weight:500;padding:3px 6px 3px 0;color:var(--accent)">t</th>${cols.map(c => `<th style="text-align:left;font-weight:500;padding:3px 6px 3px 0">${c.label}</th>`).join('')}</tr>

  }

  function stdev(a) { const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); }

  // derives rough walking-rhythm metrics from a time series of ankle height + knee angle
  function gaitMetrics(rows) {

  // Heuristic only — not derived from a validated clinical dataset. Combines three

  function gaitBand(g) {

    let older = 0, younger = 0;
    if (g.cadence < 95) older++; else younger++;

    if (g.kneeROM !== null) { if (g.kneeROM < 25) older++; else younger++; }
    if (older > younger) return 'This clip\u2019s rhythm skews toward patterns more common in older adults (slower cadence, more step-to-step variability, and/or reduced knee range of motion) in published gait research.';
    if (younger > older) return 'This clip\u2019s rhythm skews toward patterns more common in younger/midlife adults (brisker, steadier cadence and fuller knee range of motion) in published gait research.';

  // Compares this video's trunk numbers to this same account's own history (RLS already

    { band: '30-39', mid: 34.5, cadence: 107.87, strideLength: 1.29, kneeROM: 50.33, kneeHeightVar: 0.10, spineLean: 0.5, headOffset: 0.4, smoothness: 3 },

    const lHips = ok.map(r => r.m.form.leftHip).filter(v => v != null), rHips = ok.map(r => r.m.form.rightHip).filter(v => v != null);
    const kneeROM = (lKnees.length && rKnees.length) ? +(Math.max(...lKnees, ...rKnees) - Math.min(...lKnees, ...rKnees)).toFixed(1) : null;
    const hipROM = (lHips.length && rHips.length) ? +(Math.max(...lHips, ...rHips) - Math.min(...lHips, ...rHips)).toFixed(1) : null;

    }

    const trunkXs = ok.map(r => r.trunkX);
    const sway = trunkXs.length ? +(Math.max(...trunkXs) - Math.min(...trunkXs)).toFixed(3) : null;
    const deltas = trunkXs.slice(1).map((v, i) => Math.abs(v - trunkXs[i]));
    const smoothnessCV = deltas.length > 1 ? +(stdev(deltas) / (avg(deltas) || 1e-6) * 100).toFixed(1) : null;

    return {
      view: { manual: cameraView || null, detected: detected.view, detectedRatio: detected.ratio, effective: effectiveView },
      rhythm: { cadence, stepTimeVariabilityPct: stepTimeCV, gaitCycleDurationSec, stepsDetected: combinedT.length },
      stride: { strideLengthM, strideLengthToHeightRatio: strideRatio, reliable: strideReliable, reason: strideReason },
      kneeHip: {
        avgLeftKnee: lKnees.length ? +avg(lKnees).toFixed(1) : null, avgRightKnee: rKnees.length ? +avg(rKnees).toFixed(1) : null, kneeROM,
        avgLeftHip: lHips.length ? +avg(lHips).toFixed(1) : null, avgRightHip: rHips.length ? +avg(rHips).toFixed(1) : null, hipROM
      },
      footClearance: { clearanceCm, calibrated: clearanceCalibrated },
      trunk: { spineLeanPct: avgNum(rows, 'posture', 'spineLean'), headOffsetPct: avgNum(rows, 'posture', 'headOffset'), swayNormalized: sway, smoothnessVariabilityPct: smoothnessCV }
    };
  }

  // Derives the six requested gait metrics + quality fields from raw per-frame landmark data.
  // Height (cm) is only used to convert screen-space units into real meters; without it,
  // stepWidthVariability/walkingSpeedMps are returned as normalized (unitless) values instead.
  function computeExtendedGait(rows, heightCm, vidW, vidH) {
    const ok = rows.filter(r => r.m && r.lay !== undefined);
    const t = ok.map(r => r.t), lay = ok.map(r => r.lay), ray = ok.map(r => r.ray);
    const minimaT = (arr) => { const out = []; for (let i = 1; i < arr.length - 1; i++) if (arr[i] < arr[i - 1] && arr[i] < arr[i + 1]) out.push(t[i]); return out; };
    const lMin = minimaT(lay), rMin = minimaT(ray);
    const combined = [...lMin, ...rMin].sort((a, b) => a - b);
    const combinedInt = []; for (let i = 1; i < combined.length; i++) combinedInt.push(combined[i] - combined[i - 1]);
    const meanCombined = combinedInt.length ? combinedInt.reduce((a, b) => a + b, 0) / combinedInt.length : null;
    const cadence = meanCombined ? +(60 / meanCombined).toFixed(1) : null;

    const intervalsOf = (arr) => { const o = []; for (let i = 1; i < arr.length; i++) o.push(arr[i] - arr[i - 1]); return o; };
    const lInt = intervalsOf(lMin), rInt = intervalsOf(rMin);
    const lAvg = lInt.length ? lInt.reduce((a, b) => a + b, 0) / lInt.length : null;
    const rAvg = rInt.length ? rInt.reduce((a, b) => a + b, 0) / rInt.length : null;
    const stepTimeAsymmetry = (lAvg && rAvg) ? +(Math.abs(lAvg - rAvg) / ((lAvg + rAvg) / 2)).toFixed(3) : null;

    const trunkXs = ok.map(r => r.trunkX);
    const trunkSway = trunkXs.length ? +(Math.max(...trunkXs) - Math.min(...trunkXs)).toFixed(3) : null;

    const lwx = ok.map(r => r.lwx), rwx = ok.map(r => r.rwx);
    const lAmp = lwx.length ? Math.max(...lwx) - Math.min(...lwx) : null;
    const rAmp = rwx.length ? Math.max(...rwx) - Math.min(...rwx) : null;
    const armSwingAsymmetry = (lAmp != null && rAmp != null && (lAmp + rAmp) > 0) ? +(Math.abs(lAmp - rAmp) / ((lAmp + rAmp) / 2)).toFixed(3) : null;

    let metersPerPixelX = null;
    if (heightCm && vidW && vidH) {
      const heights = ok.map(r => r.bodyPxH).filter(v => v && v > 0);
      if (heights.length) metersPerPixelX = (heightCm / 100) / (heights.reduce((a, b) => a + b, 0) / heights.length);
    }

    const widths = ok.map(r => Math.abs(r.lax - r.rax));
    let stepWidthVariability = null, stepWidthUnit = 'normalized';
    if (widths.length > 1) {
      const m = widths.reduce((a, b) => a + b, 0) / widths.length;
      const sd = Math.sqrt(widths.reduce((s, v) => s + (v - m) ** 2, 0) / widths.length);
      if (metersPerPixelX) { stepWidthVariability = +(sd * vidW * metersPerPixelX).toFixed(3); stepWidthUnit = 'meters'; }
      else { stepWidthVariability = +sd.toFixed(3); }
    }

    let walkingSpeedMps = null, speedUnit = 'normalized/sec';
    if (trunkXs.length > 1 && t.length > 1) {
      const dtSec = t[t.length - 1] - t[0];
      if (dtSec > 0) {
        const dxNorm = Math.abs(trunkXs[trunkXs.length - 1] - trunkXs[0]);
        if (metersPerPixelX) { walkingSpeedMps = +((dxNorm * vidW * metersPerPixelX) / dtSec).toFixed(3); speedUnit = 'm/s'; }
        else walkingSpeedMps = +(dxNorm / dtSec).toFixed(3);
      }
    }

    const validFrameRatio = rows.length ? +(ok.length / rows.length).toFixed(2) : null;
    const visVals = ok.map(r => r.vis).filter(v => v != null);
    const landmarkVisibility = visVals.length ? +(visVals.reduce((a, b) => a + b, 0) / visVals.length).toFixed(2) : null;

    return { cadence, stepTimeAsymmetry, trunkSway, armSwingAsymmetry, stepWidthVariability, stepWidthUnit, walkingSpeedMps, speedUnit, validFrameRatio, landmarkVisibility, validGaitCycles: combinedInt.length, calibrated: !!metersPerPixelX };
  }

  function qualityLabel(validFrameRatio, landmarkVisibility) {
    if (validFrameRatio == null || landmarkVisibility == null) return 'unknown';
    const s = (validFrameRatio + landmarkVisibility) / 2;
    return s > 0.8 ? 'good' : s > 0.5 ? 'fair' : 'poor';
  }

  // Builds the payload from data this app has actually already computed —
  // nothing here is invented; every field traces back to metricsFromLandmarks() / gaitMetrics().
  function buildAssessmentPayload(rows, vid, item) {
    const heightCm = item && item.subject_height_cm || null;
    const camView = (item && item.camera_view) || null;
    const eg = computeExtendedGait(rows, heightCm, vid.videoWidth, vid.videoHeight);
    const c = computeFiveCategories(rows, heightCm, vid.videoWidth, vid.videoHeight, camView);
    const notes = [];
    if (!item || item.subject_age == null) notes.push('userAge was not provided by the uploader; it is self-reported, not derived from the video.');
    if (!camView && c.view.detected) notes.push('cameraView was not manually selected; it was auto-detected from body proportions in the pose data (shoulder-width-to-height ratio) with ratio ' + c.view.detectedRatio + ' — treat this as a best-effort guess, not a certainty.');
    if (!eg.calibrated) notes.push('No height was provided, so stepWidthVariability, walkingSpeedMps and footClearanceCm are normalized (unitless) screen-space values, not real-world units.');
    if (eg.validGaitCycles < 2) notes.push('Very few gait cycles were detected in this clip; metrics derived from step timing may be unreliable.');
    if (!c.stride.reliable) notes.push('strideLengthM/strideLengthToHeightRatio are not reliable here: ' + c.stride.reason + '.');

    return {
      userAge: (item && item.subject_age) ?? null,
      videoDurationSeconds: vid.duration ? +vid.duration.toFixed(1) : null,
      cameraView: c.view.effective || 'unknown',
      cameraViewSource: camView ? 'manually selected' : 'auto-detected from pose data',
      poseQuality: qualityLabel(eg.validFrameRatio, eg.landmarkVisibility),
      metrics: {
        cadenceStepsPerMin: { value: eg.cadence, unit: 'steps/min', method: 'detected foot events' },
        stepTimeAsymmetry: { value: eg.stepTimeAsymmetry, unit: 'ratio', method: 'absolute left-right step-time difference divided by mean step time' },
        trunkSway: { value: eg.trunkSway, unit: 'normalized displacement', method: 'lateral trunk movement across gait cycles' },
        armSwingAsymmetry: { value: eg.armSwingAsymmetry, unit: 'ratio', method: 'left-right arm swing amplitude difference' },
        stepWidthVariability: { value: eg.stepWidthVariability, unit: eg.stepWidthUnit === 'meters' ? 'meters' : 'normalized', method: 'variability of lateral foot placement' },
        walkingSpeedMps: { value: eg.walkingSpeedMps, unit: eg.speedUnit, method: eg.calibrated ? 'calibrated displacement over time' : 'uncalibrated displacement over time (no height provided)' },
        strideLengthM: { value: c.stride.strideLengthM, unit: c.stride.strideLengthM != null ? 'meters' : 'n/a', method: 'distance between consecutive same-foot ground contacts, reliable only for side-on view with height provided', reliable: c.stride.reliable },
        strideLengthToHeightRatio: { value: c.stride.strideLengthToHeightRatio, unit: 'ratio', method: 'stride length divided by subject height', reliable: c.stride.reliable },
        gaitCycleDurationSec: { value: c.rhythm.gaitCycleDurationSec, unit: 'seconds', method: 'average time between consecutive same-foot ground contacts' },
        kneeAngleAvgDeg: { value: { left: c.kneeHip.avgLeftKnee, right: c.kneeHip.avgRightKnee }, unit: 'degrees', method: 'angle at knee between hip-knee-ankle, averaged across sampled frames' },
        kneeRangeOfMotionDeg: { value: c.kneeHip.kneeROM, unit: 'degrees', method: 'max minus min knee angle across sampled frames' },
        hipAngleAvgDeg: { value: { left: c.kneeHip.avgLeftHip, right: c.kneeHip.avgRightHip }, unit: 'degrees', method: 'angle at hip between shoulder-hip-knee, averaged across sampled frames' },
        hipRangeOfMotionDeg: { value: c.kneeHip.hipROM, unit: 'degrees', method: 'max minus min hip angle across sampled frames' },
        footClearanceCm: { value: c.footClearance.clearanceCm, unit: c.footClearance.calibrated ? 'cm' : 'normalized', method: 'vertical amplitude of ankle height during swing phase' },
        trunkSmoothness: { value: c.trunk.smoothnessVariabilityPct, unit: '% (lower = smoother)', method: 'coefficient of variation of frame-to-frame trunk displacement' }
      },
      quality: { validFrameRatio: eg.validFrameRatio, validGaitCycles: eg.validGaitCycles, landmarkVisibility: eg.landmarkVisibility },
      notes,
      // Full per-frame MediaPipe output behind the summary metrics above, for the AI to read directly
      // as a validation check on the computed numbers — not for commenting on video/recording quality.
      rawFrames: rows.map(r => r.m ? { t: r.t, posture: r.m.posture, form: r.m.form, symmetry: r.m.symmetry } : { t: r.t, poseDetected: false }),
      referenceComparison: compareToReference(c),
      assessmentInstructions: 'Use rawFrames plus the summary metrics to independently sanity-check the gait age estimate in referenceComparison — this is a validation step, not an evaluation of video/recording quality. Your task is to assess the person\u2019s gait age and produce a 4-week plan of exercises/changes aimed at reducing (improving) their gait age score, grounded in which specific metrics are driving the current estimate.'
    };
  }

  function renderAssessment(box, data) {
    if (!data || typeof data !== 'object') { box.innerHTML = '<div class="err">The assessment service returned an unexpected response.</div>'; return; }
    const sections = [
      ['Summary', data.summary],
      ['Strengths', data.strengths],
      ['Areas to improve', data.improvement_areas || data.improvementAreas],
      ['Data limitations', data.data_limitations || data.limitations],
      ['Training plan', data.training_plan || data.trainingPlan]
    ];
    let html = '';
    sections.forEach(([label, val]) => {
      if (!val) return;
      const content = Array.isArray(val) ? '<ul style="margin:4px 0 0;padding-left:18px">' + val.map(v => '<li>' + esc(String(v)) + '</li>').join('') + '</ul>' : '<p style="margin:4px 0 0">' + esc(String(val)) + '</p>';
      html += '<div style="margin-top:10px"><b>' + label + '</b>' + content + '</div>';
    });
    box.innerHTML = html || '<div class="dim">Assessment received, but none of the expected fields (summary, strengths, improvement_areas, data_limitations, training_plan) were present. Raw response: ' + esc(JSON.stringify(data)) + '</div>';
  }

  async function requestAssessment(btn, box, rows, vid, item) {
    if (btn.disabled) return; // guards against double-taps / repeat clicks while a request is in flight
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = 'Getting AI assessment…';
    box.style.display = 'block';
    box.innerHTML = '<span class="dim">Contacting assessment service…</span>';
    try {
      const payload = buildAssessmentPayload(rows, vid, item);
      const { data, error } = await sb.functions.invoke('dynamic-responder', { body: payload });
      if (error) throw error;
      renderAssessment(box, data);
    } catch (e) {
      box.innerHTML = '<div class="err">Could not get an AI assessment: ' + esc(String((e && e.message) || e)) + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  // Only shows the fields that match the Edge Function's schema. Full per-frame landmark
  // data is still saved to videos.report (see analyze()) for later recompute — just not displayed.
  function showReport(el, rows, vid, item) {
    const ok = rows.filter(r => r.m);
    if (!ok.length) { el.innerHTML = '<div class="err">No pose detected. Use a video where the full body is clearly visible.</div>'; return { gait: null, age: null }; }
    const heightCm = item && item.subject_height_cm || null, camView = item && item.camera_view || null;
    const c = computeFiveCategories(rows, heightCm, vid.videoWidth, vid.videoHeight, camView);
    const cmp = compareToReference(c);
    const row = (label, val, unit) => `<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="dim">${label}</span><span>${val ?? '—'}${val != null ? ' ' + unit : ''}</span></div>`;
    const viewLabel = c.view.manual
      ? c.view.manual + ' (you selected this)'
      : (c.view.detected ? c.view.detected + ' (auto-detected from the video' + (c.view.detectedRatio != null ? ', shoulder/height ratio ' + c.view.detectedRatio : '') + ')' : 'could not auto-detect');
    let html = `<div>Pose found in ${ok.length}/${rows.length} sampled frames.</div>
      <div class="dim" style="font-size:11px;margin-top:2px">On file for this video — height: ${heightCm ? heightCm + 'cm' : 'not provided'} &middot; camera view: ${viewLabel}</div>
      ${!heightCm ? '<div style="margin-top:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Add height for stride length &amp; foot clearance in real units (optional — everything else still works without it).</span><button class="addHeightBtn" style="white-space:nowrap;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--text)">Add height</button></div>' : ''}
      <div style="margin-top:10px"><b>1. Walking rhythm &amp; cadence</b>
        ${row('Cadence', c.rhythm.cadence, 'steps/min')}
        ${row('Step-time variability', c.rhythm.stepTimeVariabilityPct, '%')}
        ${row('Gait cycle duration', c.rhythm.gaitCycleDurationSec, 's')}
      </div>
      <div style="margin-top:10px"><b>2. Stride length vs. height</b>
        ${row('Stride length', c.stride.strideLengthM, 'm')}
        ${row('Stride / height ratio', c.stride.strideLengthToHeightRatio, '')}
        <div class="dim" style="font-size:11px;margin-top:2px">${c.stride.reliable ? 'Reliable — height provided and a side-on camera view (' + viewLabel + ').' : 'Not reliable: ' + c.stride.reason + '. Detected view: ' + viewLabel + '. If this looks wrong, set Camera view manually in Edit info to override it.'}</div>
      </div>
      <div style="margin-top:10px"><b>3. Knee flexion &amp; hip extension</b>
        ${row('Avg knee angle (L / R)', (c.kneeHip.avgLeftKnee ?? '—') + ' / ' + (c.kneeHip.avgRightKnee ?? '—'), '&deg;')}
        ${row('Knee range of motion', c.kneeHip.kneeROM, '&deg;')}
        ${row('Avg hip angle (L / R)', (c.kneeHip.avgLeftHip ?? '—') + ' / ' + (c.kneeHip.avgRightHip ?? '—'), '&deg;')}
        ${row('Hip range of motion', c.kneeHip.hipROM, '&deg;')}
      </div>
      <div style="margin-top:10px"><b>4. Foot clearance &amp; gait-cycle timing</b>
        ${row('Foot clearance', c.footClearance.clearanceCm, c.footClearance.calibrated ? 'cm' : '(normalized — add height for cm)')}
        ${row('Gait cycle duration', c.rhythm.gaitCycleDurationSec, 's')}
      </div>
      <div style="margin-top:10px"><b>5. Trunk posture &amp; movement smoothness</b>
        ${row('Spine lean', c.trunk.spineLeanPct, '%')}
        ${row('Head offset', c.trunk.headOffsetPct, '%')}
        ${row('Lateral trunk sway', c.trunk.swayNormalized, '(normalized)')}
        ${row('Movement smoothness (lower = smoother)', c.trunk.smoothnessVariabilityPct, '%')}
        <div class="dim trunkPct" style="font-size:11px;margin-top:6px">Comparing to your own history…</div>
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
          <b style="font-size:12px">Trunk age estimate (illustrative, test only)</b>
          ${row('From spine lean', cmp.spineLeanAge, 'yrs')}
          ${row('From head offset', cmp.headOffsetAge, 'yrs')}
          ${row('From movement smoothness', cmp.smoothnessAge, 'yrs')}
          <div class="dim" style="font-size:11px;margin-top:4px">Not a citation of a specific study's measured values — an app-estimated curve anchored at a "perfect" score around age 25, degrading in the general direction published postural-control/smoothness aging research reports. Source: App algorithm, direction informed by published aging literature. Kept separate from the total gait age score below and not affected by the calculation weights.</div>
        </div>
      </div>`;
    html += `<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px"><b>Reference-based gait age (test)</b>
      <div class="dim" style="font-size:11px;margin-top:2px">Nearest-matching age band vs. a published healthy-adult gait study (decade bands, 20s\u201370+), per category:</div>
      ${row('From cadence', cmp.cadenceAge, 'yrs')}
      ${row('From stride length', cmp.strideAge, 'yrs')}
      ${row('From knee range of motion', cmp.kneeAge, 'yrs')}
      ${row('From foot clearance (low confidence)', cmp.clearanceAge, 'yrs')}
      <div class="dim" style="font-size:11px;margin-top:2px">Trunk not included here \u2014 see "Trunk age estimate" above, kept separate since it's an illustrative app estimate, not a direct study citation like the categories above.</div>
      <div style="margin-top:6px"><b>Total gait age score: ${cmp.totalScore ?? '\u2014'}${cmp.totalScore != null ? ' yrs' : ''} (weighted across ${cmp.categoriesUsed} of 4 scorable categories)</b></div>
      ${cmp.weightsApplied && cmp.weightsApplied.length ? '<div class="dim" style="font-size:11px;margin-top:2px">Weights used: ' + cmp.weightsApplied.map(w => esc(WEIGHT_LABELS[w.metric]) + ' \u00d7' + w.weight).join(', ') + '</div>' : ''}
      <div class="dim" style="font-size:11px;margin-top:4px">Experimental test only. Matched against one published sample, not a clinical or diagnostic tool, and not validated against this app\u2019s own camera-based measurement method.</div>
    </div>`;
    html += `<div style="margin-top:14px"><button class="aiBtn" style="width:100%">Get AI assessment</button>
      <div class="aiBox" style="display:none;margin-top:8px"></div></div>`;
    el.innerHTML = html;
    const aiBtn = el.querySelector('.aiBtn'), aiBox = el.querySelector('.aiBox');
    if (aiBtn) aiBtn.onclick = () => requestAssessment(aiBtn, aiBox, rows, vid, item);
    const addHeightBtn = el.querySelector('.addHeightBtn');
    if (addHeightBtn) addHeightBtn.onclick = () => {
      const card = el.closest('.card');
      if (!card) return;
      const infoBox = card.querySelector('.infoBox');
      infoBox.style.display = 'block';
      const hInput = card.querySelector('.fHeight');
      if (hInput) { hInput.focus(); hInput.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    };
    loadTrunkPercentile(el, c.trunk.swayNormalized, c.trunk.smoothnessVariabilityPct);
    return { gait: gaitMetrics(rows), age: gaitAgeEstimate(gaitMetrics(rows)) };
  }

  async function analyze(vid, rep, item) {
    const id = item.id;
    rep.style.display = 'block';
    const say = m => { rep.innerHTML = '<span class="dim">' + esc(m) + '</span>'; };
    let lm;
    try { lm = await getLandmarker(say); }
    catch (e) { rep.innerHTML = '<div class="err">Could not load the pose model: ' + esc(String((e && e.message) || e)) + '</div>'; return; }
    if (!vid.duration || !isFinite(vid.duration)) { rep.innerHTML = '<div class="err">Video not ready yet, try again in a moment.</div>'; return; }
    // ~4 samples/second (enough to catch each step's up-down motion), capped between 16 and 80
    const N = Math.min(80, Math.max(16, Math.round(vid.duration * 4))), rows = [], back = vid.currentTime; vid.pause();
    say('Analyzing ' + N + ' frames...');
    try {
      for (let i = 0; i < N; i++) {
        const t = vid.duration * (i + 0.5) / N;
        await seek(vid, t);
        const res = lm.detectForVideo(vid, performance.now());
        const p = res.landmarks && res.landmarks[0];
        const T = +t.toFixed(1);
        if (!p) { rows.push({ t: T, m: null }); continue; }
        rows.push({
          t: T, m: metricsFromLandmarks(p),
          lay: p[27].y, ray: p[28].y, lax: p[27].x, rax: p[28].x,
          lwx: p[15].x, rwx: p[16].x,
          lsx: p[11].x, rsx: p[12].x,
          trunkX: ((p[11].x + p[12].x) / 2 + (p[23].x + p[24].x) / 2) / 2,
          vis: p.reduce((a, q) => a + (q.visibility || 0), 0) / p.length,
          bodyPxH: (((p[27].y + p[28].y) / 2) - p[0].y) * (vid.videoHeight || 0)
        });
      }
    } catch (e) { rep.innerHTML = '<div class="err">Analysis failed: ' + esc(String((e && e.message) || e)) + '</div>'; return; }
    vid.currentTime = back;
    showReport(rep, rows, vid, item);
    await sb.from('videos').update({ report: rows }).eq('id', id);

    const heightCm = item.subject_height_cm || null, camView = item.camera_view || null;
    const c = computeFiveCategories(rows, heightCm, vid.videoWidth, vid.videoHeight, camView);
    const legacyAge = gaitAgeEstimate(gaitMetrics(rows)); // kept for continuity with earlier saved history rows
    const cmp = compareToReference(c);
    if (c.rhythm.cadence !== null) {
      await sb.from('gait_history').insert({
        video_id: id,
        cadence: c.rhythm.cadence, step_cv: c.rhythm.stepTimeVariabilityPct, steps_detected: c.rhythm.stepsDetected,
        gait_cycle_duration_sec: c.rhythm.gaitCycleDurationSec,
        stride_length_m: c.stride.strideLengthM, stride_length_ratio: c.stride.strideLengthToHeightRatio, stride_reliable: c.stride.reliable,
        knee_rom: c.kneeHip.kneeROM, hip_rom: c.kneeHip.hipROM,
        avg_left_knee: c.kneeHip.avgLeftKnee, avg_right_knee: c.kneeHip.avgRightKnee,
        avg_left_hip: c.kneeHip.avgLeftHip, avg_right_hip: c.kneeHip.avgRightHip,
        foot_clearance_cm: c.footClearance.clearanceCm,
        trunk_sway: c.trunk.swayNormalized, trunk_smoothness: c.trunk.smoothnessVariabilityPct,
        age_low: legacyAge ? legacyAge.low : null, age_high: legacyAge ? legacyAge.high : null, age_mid: legacyAge ? legacyAge.mid : null,
        cadence_age: cmp.cadenceAge, stride_age: cmp.strideAge, knee_age: cmp.kneeAge, clearance_age: cmp.clearanceAge,
        total_gait_age_score: cmp.totalScore, categories_used: cmp.categoriesUsed
      });
      loadHistory();
    }
  }
}
</script>
</body>
</html>
