<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reelbox">
<meta name="theme-color" content="#14171C">
<title>Reelbox</title>
<style>
  :root { --bg:#14171C; --surface:#1C2129; --border:#2A2F38; --text:#E9E6DE; --muted:#8A9099; --accent:#E8A33D; --danger:#E2685C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,'Segoe UI',sans-serif; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
  .brand { font-weight:700; font-size:19px; } .brand span { color:var(--accent); }
  .who { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  button { font-family:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 14px; font-size:14px; }
  button.primary { background:var(--accent); color:#17130A; border-color:var(--accent); font-weight:600; }
  button.text { background:none; border:none; color:var(--muted); }
  button:disabled { opacity:.5; }
  main { max-width:780px; margin:0 auto; padding:28px 20px 80px; }
  .auth { max-width:360px; margin:6vh auto 0; }
  .auth h1 { font-size:26px; margin:0 0 20px; }
  input[type=email], input[type=password] { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:8px; font-size:16px; margin-bottom:12px; }
  .msg { font-size:13px; color:var(--danger); min-height:18px; margin-top:10px; line-height:1.5; }
  .msg.ok { color:var(--accent); }
  .switch { margin-top:16px; font-size:13px; color:var(--muted); } .switch a { color:var(--accent); cursor:pointer; }
  .upload { border:1px dashed var(--border); border-radius:12px; padding:22px; text-align:center; margin-bottom:28px; }
  .upload p { margin:0 0 12px; color:var(--muted); font-size:14px; }
  input[type=file] { display:none; }
  .grid { display:grid; grid-template-columns:1fr; gap:20px; }
  @media (min-width:640px) { .grid { grid-template-columns:1fr 1fr; } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .card video { width:100%; display:block; background:#000; max-height:260px; }
  .meta { padding:12px 14px; display:flex; gap:8px; align-items:center; }
  .meta .title { flex:1; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta button { padding:5px 9px; font-size:12px; }
  .arow { padding:0 14px 14px; } .arow button { width:100%; }
  .report { border-top:1px solid var(--border); padding:12px 14px 14px; font-size:13px; line-height:1.5; }
  .report .err { color:var(--danger); } .report .dim { color:var(--muted); }
  .rows { max-height:150px; overflow-y:auto; margin-top:8px; color:var(--muted); font-size:12px; }
  .rows b { color:var(--accent); font-weight:500; display:inline-block; width:42px; }
  .empty { color:var(--muted); text-align:center; padding:30px 0; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span>&#9635;</span> Reelbox</div>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== PASTE YOUR TWO SUPABASE VALUES HERE ======
const SUPABASE_URL = 'PASTE_PROJECT_URL_HERE';
const SUPABASE_KEY = 'PASTE_ANON_KEY_HERE';
// =================================================

const app = document.getElementById('app');
const who = document.getElementById('who');
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

if (SUPABASE_URL.startsWith('PASTE') || SUPABASE_KEY.startsWith('PASTE')) {
  app.innerHTML = '<div class="empty">Setup needed: open this file and paste your Supabase Project URL and anon key at the top of the script.</div>';
} else {
  start();
}

function start() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let mode = 'login';
  let user = null;

  sb.auth.getSession().then(({ data }) => { user = data.session ? data.session.user : null; render(); });
  sb.auth.onAuthStateChange((_e, session) => { user = session ? session.user : null; render(); });

  function render() {
    who.innerHTML = '';
    if (!user) return renderAuth();
    who.innerHTML = '<span>' + esc(user.email) + '</span>';
    const b = document.createElement('button'); b.className = 'text'; b.textContent = 'Log out';
    b.onclick = () => sb.auth.signOut();
    who.appendChild(b);
    renderDash();
  }

  function renderAuth() {
    const login = mode === 'login';
    app.innerHTML = `<div class="auth"><h1>${login ? 'Log in' : 'Create account'}</h1>
      <input id="em" type="email" placeholder="Email" autocomplete="email">
      <input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="${login ? 'current-password' : 'new-password'}">
      <button class="primary" id="go">${login ? 'Log in' : 'Sign up'}</button>
      <div class="msg" id="msg"></div>
      <div class="switch">${login ? "New here? <a id='sw'>Create an account</a>" : "Have an account? <a id='sw'>Log in</a>"}</div></div>`;
    document.getElementById('sw').onclick = () => { mode = login ? 'signup' : 'login'; renderAuth(); };
    const go = async () => {
      const email = document.getElementById('em').value.trim();
      const password = document.getElementById('pw').value;
      const msg = document.getElementById('msg');
      msg.className = 'msg'; msg.textContent = '';
      if (!email || !password) { msg.textContent = 'Enter email and password.'; return; }
      const res = login ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
      if (res.error) { msg.textContent = res.error.message; return; }
      if (!login && !res.data.session) { msg.className = 'msg ok'; msg.textContent = 'Check your email to confirm, then log in.'; }
    };
    document.getElementById('go').onclick = go;
    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  function renderDash() {
    app.innerHTML = `<div class="upload"><p>Upload a video. It is saved to your account and available on any device.</p>
      <button class="primary" id="pick">Choose video</button><input type="file" id="file" accept="video/*">
      <div class="msg" id="upmsg"></div></div>
      <div class="grid" id="grid"></div>
      <div style="margin-top:36px"><b>Gait age history</b>
        <div class="dim" style="font-size:12px;margin:4px 0 10px">Every time you run Analyze pose on a walking clip, the parameters and estimate are saved here so you can compare over time.</div>
        <div id="history"></div>
      </div>`;
    const file = document.getElementById('file');
    document.getElementById('pick').onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files[0]; if (!f) return;
      const m = document.getElementById('upmsg');
      m.className = 'msg ok'; m.textContent = 'Uploading ' + f.name + ' ...';
      const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = user.id + '/' + Date.now() + '_' + safe;
      const up = await sb.storage.from('videos').upload(path, f, { contentType: f.type || 'video/mp4' });
      if (up.error) { m.className = 'msg'; m.textContent = 'Upload failed: ' + up.error.message; return; }
      const ins = await sb.from('videos').insert({ title: f.name, path });
      if (ins.error) { m.className = 'msg'; m.textContent = 'Saved file but not record: ' + ins.error.message; return; }
      m.textContent = ''; file.value = '';
      loadGrid();
    };
    loadGrid();
    loadHistory();
  }

  async function loadHistory() {
    const box = document.getElementById('history');
    if (!box) return;
    const { data: rows, error } = await sb.from('gait_history').select('*').order('created_at', { ascending: false }).limit(50);
    if (error) { box.innerHTML = '<div class="dim" style="font-size:12px">' + esc(error.message) + '</div>'; return; }
    if (!rows.length) { box.innerHTML = '<div class="dim" style="font-size:12px">No gait estimates saved yet.</div>'; return; }
    box.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:12px;color:var(--muted)">
      <tr><th style="text-align:left;padding:4px 8px 4px 0">Date</th><th style="text-align:left;padding:4px 8px 4px 0">Cadence</th><th style="text-align:left;padding:4px 8px 4px 0">Variability</th><th style="text-align:left;padding:4px 8px 4px 0">Knee ROM</th><th style="text-align:left;padding:4px 8px 4px 0;color:var(--accent)">Est. age</th></tr>
      ${rows.map(r => `<tr>
        <td style="padding:4px 8px 4px 0">${new Date(r.created_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'})}</td>
        <td style="padding:4px 8px 4px 0">${r.cadence ?? '—'}</td>
        <td style="padding:4px 8px 4px 0">${r.step_cv ?? '—'}%</td>
        <td style="padding:4px 8px 4px 0">${r.knee_rom ?? '—'}&deg;</td>
        <td style="padding:4px 8px 4px 0;color:var(--accent)">${r.age_low != null ? r.age_low + '\u2013' + r.age_high : '—'}</td>
      </tr>`).join('')}
    </table>`;
  }

  async function loadGrid() {
    const grid = document.getElementById('grid');
    const { data: rows, error } = await sb.from('videos').select('*').order('created_at', { ascending: false });
    if (error) { grid.innerHTML = '<div class="empty">' + esc(error.message) + '</div>'; return; }
    if (!rows.length) { grid.innerHTML = '<div class="empty">No videos yet. Upload your first one above.</div>'; return; }
    const { data: signed } = await sb.storage.from('videos').createSignedUrls(rows.map(r => r.path), 3600);
    const urlFor = {}; (signed || []).forEach(s => { urlFor[s.path] = s.signedUrl; });
    grid.innerHTML = '';
    rows.forEach(item => {
      const url = urlFor[item.path] || '';
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<video src="${url}" controls playsinline crossorigin="anonymous" preload="metadata"></video>
        <div class="meta"><span class="title">${esc(item.title || 'video')}</span>
        <button class="dl">Download</button><button class="del">Delete</button></div>
        <div class="arow"><button class="an">Analyze pose</button></div>
        <div class="report" style="display:none"></div>`;
      const vid = card.querySelector('video'), rep = card.querySelector('.report');
      if (item.report) { rep.style.display = 'block'; showReport(rep, item.report, { title: item.title }); }
      card.querySelector('.dl').onclick = async () => {
        const r = await sb.storage.from('videos').createSignedUrl(item.path, 300, { download: item.title || true });
        if (r.data) location.href = r.data.signedUrl;
      };
      card.querySelector('.del').onclick = async () => {
        if (!confirm('Delete this video?')) return;
        await sb.storage.from('videos').remove([item.path]);
        await sb.from('videos').delete().eq('id', item.id);
        loadGrid();
      };
      card.querySelector('.an').onclick = () => analyze(vid, rep, item.id, item.title);
      grid.appendChild(card);
    });
  }

  // ---------- MediaPipe Pose Landmarker ----------
  let landmarkerP = null;
  function getLandmarker(status) {
    if (landmarkerP) return landmarkerP;
    landmarkerP = (async () => {
      status('Loading pose library...');
      const v = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
      const fs = await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      status('Loading pose model...');
      return v.PoseLandmarker.createFromOptions(fs, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' },
        runningMode: 'VIDEO', numPoses: 1
      });
    })();
    landmarkerP.catch(() => { landmarkerP = null; });
    return landmarkerP;
  }
  // ---- toggle which categories you want to see ----
  const SHOW_POSTURE = true;
  const SHOW_FORM = true;
  const SHOW_SYMMETRY = true;
  const SHOW_GAIT = true;
  // ---------------------------------------------------

  const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  // angle at point b, between rays b->a and b->c (used for elbow/knee bend)
  const angle3 = (a, b, c) => {
    const v1 = { x: a.x - b.x, y: a.y - b.y }, v2 = { x: c.x - b.x, y: c.y - b.y };
    const d = v1.x * v2.x + v1.y * v2.y, m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y);
    return m ? Math.acos(Math.max(-1, Math.min(1, d / m))) * 180 / Math.PI : null;
  };
  const seek = (v, t) => new Promise(r => { const f = () => { v.removeEventListener('seeked', f); r(); }; v.addEventListener('seeked', f); v.currentTime = t; });

  // pulls every metric out of one frame's 33 landmarks
  function metricsFromLandmarks(p) {
    const [nose, , , , , , , , , , , lSh, rSh, lEl, rEl, lWr, rWr, , , , , , , lHip, rHip, lKn, rKn, lAn, rAn] = p;
    return {
      posture: {
        shoulderTilt: +ang(lSh, rSh).toFixed(1),
        hipTilt: +ang(lHip, rHip).toFixed(1),
        headOffset: +((nose.x - (lSh.x + rSh.x) / 2) * 100).toFixed(1),      // % of frame width, + = head right of shoulder center
        spineLean: +(((lSh.x + rSh.x) / 2 - (lHip.x + rHip.x) / 2) * 100).toFixed(1) // + = shoulders right of hips
      },
      form: {
        leftElbow: round1(angle3(lSh, lEl, lWr)),
        rightElbow: round1(angle3(rSh, rEl, rWr)),
        leftKnee: round1(angle3(lHip, lKn, lAn)),
        rightKnee: round1(angle3(rHip, rKn, rAn))
      },
      symmetry: {
        shoulderHeightDiff: +(Math.abs(lSh.y - rSh.y) * 100).toFixed(1),
        hipHeightDiff: +(Math.abs(lHip.y - rHip.y) * 100).toFixed(1),
        wristHeightDiff: +(Math.abs(lWr.y - rWr.y) * 100).toFixed(1)
      }
    };
  }
  function round1(v) { return v === null ? null : +v.toFixed(1); }

  function avgOf(rows, cat, key) {
    const vals = rows.filter(r => r.m).map(r => r.m[cat][key]).filter(v => v !== null && v !== undefined);
    return vals.length ? (vals.reduce((a, b) => a + Math.abs(b), 0) / vals.length).toFixed(1) : '—';
  }
  // same calculation as avgOf but returns a real number (or null) for sending as JSON, not a display string
  function avgNum(rows, cat, key) {
    const vals = rows.filter(r => r.m).map(r => r.m[cat][key]).filter(v => v !== null && v !== undefined);
    return vals.length ? +(vals.reduce((a, b) => a + Math.abs(b), 0) / vals.length).toFixed(1) : null;
  }

  function table(rows, cat, cols) {
    return `<table style="width:100%;border-collapse:collapse;font-size:12px;color:var(--muted);margin-top:6px">
      <tr><th style="text-align:left;font-weight:500;padding:3px 6px 3px 0;color:var(--accent)">t</th>${cols.map(c => `<th style="text-align:left;font-weight:500;padding:3px 6px 3px 0">${c.label}</th>`).join('')}</tr>
      ${rows.map(r => `<tr><td style="padding:3px 6px 3px 0;color:var(--accent)">${r.t}s</td>${r.m ? cols.map(c => `<td style="padding:3px 6px 3px 0">${r.m[cat][c.key] ?? '—'}${c.unit||''}</td>`).join('') : `<td colspan="${cols.length}">no pose</td>`}</tr>`).join('')}
    </table>`;
  }

  function stdev(a) { const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); }

  // derives rough walking-rhythm metrics from a time series of ankle height + knee angle
  function gaitMetrics(rows) {
    const ok = rows.filter(r => r.m && r.lay !== undefined);
    const t = ok.map(r => r.t), lay = ok.map(r => r.lay);
    const minimaT = [];
    for (let i = 1; i < lay.length - 1; i++) if (lay[i] < lay[i - 1] && lay[i] < lay[i + 1]) minimaT.push(t[i]);
    const intervals = [];
    for (let i = 1; i < minimaT.length; i++) intervals.push(minimaT[i] - minimaT[i - 1]);
    const meanInt = intervals.length ? intervals.reduce((a, b) => a + b, 0) / intervals.length : null;
    const cadence = meanInt ? +(60 / meanInt).toFixed(1) : null;
    const cv = (meanInt && intervals.length > 1) ? +(stdev(intervals) / meanInt * 100).toFixed(1) : null;
    const kneeVals = ok.filter(r => r.m.form.leftKnee != null && r.m.form.rightKnee != null).map(r => (r.m.form.leftKnee + r.m.form.rightKnee) / 2);
    const kneeROM = kneeVals.length ? +(Math.max(...kneeVals) - Math.min(...kneeVals)).toFixed(1) : null;
    return { cadence, cv, kneeROM, steps: minimaT.length };
  }

  // Heuristic only — not derived from a validated clinical dataset. Combines three
  // directional trends from published gait-aging research into a rough age band.
  function gaitAgeEstimate(g) {
    if (g.cadence === null || g.steps < 2) return null;
    let score = 0; // -1 = younger-leaning, +1 = older-leaning, per factor
    score += g.cadence < 95 ? 1 : (g.cadence > 115 ? -1 : 0);
    if (g.cv !== null) score += g.cv > 18 ? 1 : (g.cv < 8 ? -1 : 0);
    if (g.kneeROM !== null) score += g.kneeROM < 25 ? 1 : (g.kneeROM > 45 ? -1 : 0);
    const mid = Math.round(45 + score * 12);           // centered on 45, +/-12 per net factor
    const low = Math.max(18, mid - 15), high = mid + 15; // wide uncertainty band on purpose
    return { low, high, mid };
  }

  function gaitBand(g) {
    if (g.cadence === null || g.steps < 2) return 'Not enough walking motion in this clip to estimate rhythm — try a longer clip of continuous walking, filmed from the side or back.';
    let older = 0, younger = 0;
    if (g.cadence < 95) older++; else younger++;
    if (g.cv !== null) { if (g.cv > 18) older++; else younger++; }
    if (g.kneeROM !== null) { if (g.kneeROM < 25) older++; else younger++; }
    if (older > younger) return 'This clip\u2019s rhythm skews toward patterns more common in older adults (slower cadence, more step-to-step variability, and/or reduced knee range of motion) in published gait research.';
    if (younger > older) return 'This clip\u2019s rhythm skews toward patterns more common in younger/midlife adults (brisker, steadier cadence and fuller knee range of motion) in published gait research.';
    return 'This clip\u2019s rhythm sits in a mixed range, without a clear lean toward younger or older walking patterns.';
  }

  // Builds the payload from data this app has actually already computed —
  // nothing here is invented; every field traces back to metricsFromLandmarks() / gaitMetrics().
  function buildAssessmentPayload(rows, meta) {
    const g = gaitMetrics(rows);
    const age = gaitAgeEstimate(g);
    return {
      video_title: meta && meta.title || null,
      frames_sampled: rows.length,
      frames_with_pose: rows.filter(r => r.m).length,
      gait: { cadence_steps_per_min: g.cadence, step_time_variability_pct: g.cv, knee_range_of_motion_deg: g.kneeROM, step_cycles_detected: g.steps },
      gait_age_estimate: age ? { low: age.low, high: age.high, mid: age.mid } : null,
      posture_avg: {
        shoulder_tilt_deg: avgNum(rows, 'posture', 'shoulderTilt'), hip_tilt_deg: avgNum(rows, 'posture', 'hipTilt'),
        head_offset_pct: avgNum(rows, 'posture', 'headOffset'), spine_lean_pct: avgNum(rows, 'posture', 'spineLean')
      },
      form_avg: {
        left_elbow_deg: avgNum(rows, 'form', 'leftElbow'), right_elbow_deg: avgNum(rows, 'form', 'rightElbow'),
        left_knee_deg: avgNum(rows, 'form', 'leftKnee'), right_knee_deg: avgNum(rows, 'form', 'rightKnee')
      },
      symmetry_avg: {
        shoulder_height_diff_pct: avgNum(rows, 'symmetry', 'shoulderHeightDiff'), hip_height_diff_pct: avgNum(rows, 'symmetry', 'hipHeightDiff'),
        wrist_height_diff_pct: avgNum(rows, 'symmetry', 'wristHeightDiff')
      },
      frames: rows.map(r => r.m ? { t: r.t, posture: r.m.posture, form: r.m.form, symmetry: r.m.symmetry } : { t: r.t, no_pose: true })
    };
  }

  function renderAssessment(box, data) {
    if (!data || typeof data !== 'object') { box.innerHTML = '<div class="err">The assessment service returned an unexpected response.</div>'; return; }
    const sections = [
      ['Summary', data.summary],
      ['Strengths', data.strengths],
      ['Areas to improve', data.improvement_areas || data.improvementAreas],
      ['Data limitations', data.data_limitations || data.limitations],
      ['Training plan', data.training_plan || data.trainingPlan]
    ];
    let html = '';
    sections.forEach(([label, val]) => {
      if (!val) return;
      const content = Array.isArray(val) ? '<ul style="margin:4px 0 0;padding-left:18px">' + val.map(v => '<li>' + esc(String(v)) + '</li>').join('') + '</ul>' : '<p style="margin:4px 0 0">' + esc(String(val)) + '</p>';
      html += '<div style="margin-top:10px"><b>' + label + '</b>' + content + '</div>';
    });
    box.innerHTML = html || '<div class="dim">Assessment received, but none of the expected fields (summary, strengths, improvement_areas, data_limitations, training_plan) were present. Raw response: ' + esc(JSON.stringify(data)) + '</div>';
  }

  async function requestAssessment(btn, box, rows, meta) {
    if (btn.disabled) return; // guards against double-taps / repeat clicks while a request is in flight
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = 'Getting AI assessment…';
    box.style.display = 'block';
    box.innerHTML = '<span class="dim">Contacting assessment service…</span>';
    try {
      const payload = buildAssessmentPayload(rows, meta);
      const { data, error } = await sb.functions.invoke('dynamic-responder', { body: payload });
      if (error) throw error;
      renderAssessment(box, data);
    } catch (e) {
      box.innerHTML = '<div class="err">Could not get an AI assessment: ' + esc(String((e && e.message) || e)) + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  function showReport(el, rows, meta) {
    const ok = rows.filter(r => r.m);
    if (!ok.length) { el.innerHTML = '<div class="err">No pose detected. Use a video where the full body is clearly visible.</div>'; return; }
    let html = `<div>Pose found in ${ok.length}/${rows.length} sampled frames.</div>`;
    if (SHOW_POSTURE) html += `<div style="margin-top:10px"><b>General posture / alignment</b>
      <div class="dim">avg shoulder tilt ${avgOf(rows,'posture','shoulderTilt')}&deg; &middot; avg hip tilt ${avgOf(rows,'posture','hipTilt')}&deg; &middot; avg head offset ${avgOf(rows,'posture','headOffset')}% &middot; avg spine lean ${avgOf(rows,'posture','spineLean')}%</div>
      ${table(rows, 'posture', [{key:'shoulderTilt',label:'shoulder',unit:'°'},{key:'hipTilt',label:'hip',unit:'°'},{key:'headOffset',label:'head',unit:'%'},{key:'spineLean',label:'spine',unit:'%'}])}</div>`;
    if (SHOW_FORM) html += `<div style="margin-top:10px"><b>Exercise form (joint angles)</b>
      <div class="dim">avg L/R elbow ${avgOf(rows,'form','leftElbow')}&deg; / ${avgOf(rows,'form','rightElbow')}&deg; &middot; avg L/R knee ${avgOf(rows,'form','leftKnee')}&deg; / ${avgOf(rows,'form','rightKnee')}&deg;</div>
      ${table(rows, 'form', [{key:'leftElbow',label:'L elbow',unit:'°'},{key:'rightElbow',label:'R elbow',unit:'°'},{key:'leftKnee',label:'L knee',unit:'°'},{key:'rightKnee',label:'R knee',unit:'°'}])}</div>`;
    if (SHOW_SYMMETRY) html += `<div style="margin-top:10px"><b>Movement / symmetry</b>
      <div class="dim">avg shoulder height diff ${avgOf(rows,'symmetry','shoulderHeightDiff')}% &middot; avg hip height diff ${avgOf(rows,'symmetry','hipHeightDiff')}% &middot; avg wrist height diff ${avgOf(rows,'symmetry','wristHeightDiff')}%</div>
      ${table(rows, 'symmetry', [{key:'shoulderHeightDiff',label:'shoulders',unit:'%'},{key:'hipHeightDiff',label:'hips',unit:'%'},{key:'wristHeightDiff',label:'wrists',unit:'%'}])}</div>`;
    if (SHOW_GAIT) {
      const g = gaitMetrics(rows);
      const age = gaitAgeEstimate(g);
      html += `<div style="margin-top:10px"><b>Gait rhythm &amp; age-leaning (experimental)</b>
        <div class="dim">cadence ${g.cadence ?? '—'} steps/min &middot; step-time variability ${g.cv ?? '—'}% &middot; knee range of motion ${g.kneeROM ?? '—'}&deg; &middot; ${g.steps} step-like cycles detected</div>
        ${age ? `<div style="margin-top:6px"><b>Estimated gait age: ${age.low}&ndash;${age.high} (midpoint ${age.mid})</b></div>` : ''}
        <div class="dim" style="margin-top:6px">${gaitBand(g)}</div>
        <div class="dim" style="margin-top:6px;font-size:11px">Not a medical or validated measurement — a rough heuristic based on published population trends in walking speed, step consistency and knee motion, with a deliberately wide range. Accuracy depends heavily on a clear, full-body, side-on walking shot.</div>
      </div>`;
    }
    html += `<div style="margin-top:14px"><button class="aiBtn" style="width:100%">Get AI assessment</button>
      <div class="aiBox" style="display:none;margin-top:8px"></div></div>`;
    el.innerHTML = html;
    const aiBtn = el.querySelector('.aiBtn'), aiBox = el.querySelector('.aiBox');
    if (aiBtn) aiBtn.onclick = () => requestAssessment(aiBtn, aiBox, rows, meta);
    return { gait: SHOW_GAIT ? gaitMetrics(rows) : null, age: SHOW_GAIT ? gaitAgeEstimate(gaitMetrics(rows)) : null };
  }

  async function analyze(vid, rep, id, title) {
    rep.style.display = 'block';
    const say = m => { rep.innerHTML = '<span class="dim">' + esc(m) + '</span>'; };
    let lm;
    try { lm = await getLandmarker(say); }
    catch (e) { rep.innerHTML = '<div class="err">Could not load the pose model: ' + esc(String((e && e.message) || e)) + '</div>'; return; }
    if (!vid.duration || !isFinite(vid.duration)) { rep.innerHTML = '<div class="err">Video not ready yet, try again in a moment.</div>'; return; }
    say('Analyzing frames...');
    const N = 16, rows = [], back = vid.currentTime; vid.pause();
    try {
      for (let i = 0; i < N; i++) {
        const t = vid.duration * (i + 0.5) / N;
        await seek(vid, t);
        const res = lm.detectForVideo(vid, performance.now());
        const p = res.landmarks && res.landmarks[0];
        const T = +t.toFixed(1);
        if (!p) { rows.push({ t: T, m: null }); continue; }
        rows.push({ t: T, m: metricsFromLandmarks(p), lay: p[27].y });
      }
    } catch (e) { rep.innerHTML = '<div class="err">Analysis failed: ' + esc(String((e && e.message) || e)) + '</div>'; return; }
    vid.currentTime = back;
    const { gait, age } = showReport(rep, rows, { title });
    await sb.from('videos').update({ report: rows }).eq('id', id);
    if (gait && gait.cadence !== null) {
      await sb.from('gait_history').insert({
        video_id: id,
        cadence: gait.cadence, step_cv: gait.cv, knee_rom: gait.kneeROM, steps_detected: gait.steps,
        age_low: age ? age.low : null, age_high: age ? age.high : null, age_mid: age ? age.mid : null
      });
      loadHistory();
    }
  }
}
</script>
